<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria Vũ Bùi Kim Thư</title>
    <link rel="stylesheet" href="../style.css" >
	<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>


<body>
    <div class="profile-container">
        <div class="profile-header">
			<img src="../images/72.png" alt="Thư" style="width: 150px; height: 150px; border-radius: 50%; margin-bottom: 10px; object-fit: cover;">
			<h2>Maria</h2>
			<h2>Vũ Bùi Kim Thư</h2>
			<p>Đội 4 - Anrê</p>
		</div>
        <div class="profile-details">
            <h3> Details:</h3>
            <ul class="skills">
                <li>Giáo Xứ Gò Mây</li>
                <li>Giáo Hạt Tân Sơn Nhì</li>
            </ul>
        </div>
        <div class="skills-5">
            <h2>Kết Quả HT Cấp 1 Horeb 101: </h2>
			<div class="input-container">
                <span>Lý Thuyết: </span>
                <input type="text" value="Đạt" disabled>
            </div>
            <div class="input-container">
                <span>Tiền Sa Mạc: </span>
                <input type="text" value="9" disabled>
            </div>            
            <div class="input-container">
                <span>Sổ Khóa: </span>
                <input type="text" value="9" disabled>
            </div>
			<div class="input-container">
                <span>Hậu Sa Mạc: </span>
                <input type="text" value="9.5" disabled>
            </div>            
        </div>

		<h2 class="chuc-mung">Wait</h2>
        <div>	
            <h2 class="text-tuyen-hua">wait...</h2>
			<h1 class="date-tuyen-hua">wait...</h1>			
        </div>

        <div class="biography">
            <h2>Hình Ảnh ngày Tuyên Hứa:</h2>
			<iframe src="../loadImg.html" width="100%" height="500px" frameborder="0"></iframe>
        </div>
    </div>

    <script>
		document.addEventListener("DOMContentLoaded", function () {
            // Nhúng giá trị từ server vào JavaScript
            const htcap1 = `Đạt`; // Render từ EJS

            if (htcap1 === "Đạt") {
                // Thay đổi nội dung của các class
                document.querySelector('.chuc-mung').textContent = "Xin Chúc Mừng Tân Huynh Trưởng Cấp 1";                
				document.querySelector('.chuc-mung').classList.add("blinking");
            }else{
				document.querySelector('.chuc-mung').textContent = "Rất tiếc, bạn chưa đạt";				
				// Loại bỏ hiệu ứng nhấp nháy
				document.querySelector('.chuc-mung').classList.remove("blinking");
			}
        });
	</script>
</body>

</html>
