<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giuse Nguyễn Quan Thế Phi</title>
    <link rel="stylesheet" href="../style.css" >
	<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>


<body>
    <div class="profile-container">
        <div class="profile-header">
			<img src="./images/120.png" alt="Phi" style="width: 150px; height: 150px; border-radius: 50%; margin-bottom: 10px; object-fit: cover;">
			<h2>Giuse</h2>
			<h2>Nguyễn Quan Thế Phi</h2>
			<p>Đội 9 - Simon</p>
		</div>
        <div class="profile-details">
            <h3> Details:</h3>
            <ul class="skills">
                <li>Giáo Xứ Hạnh Thông Tây</li>
                <li>Giáo Hạt Gò Vấp</li>
            </ul>
        </div>
        <div class="skills-5">
            <h2>Kết Quả HT Cấp 1 Horeb 101: </h2>
			<div class="input-container">
                <span>Lý Thuyết: </span>
                <input type="text" value="Đạt" disabled>
            </div>
            <div class="input-container">
                <span>Tiền Sa Mạc: </span>
                <input type="text" value="9.5" disabled>
            </div>            
            <div class="input-container">
                <span>Sổ Khóa: </span>
                <input type="text" value="7" disabled>
            </div>
			<div class="input-container">
                <span>Hậu Sa Mạc: </span>
                <input type="text" value="9.8" disabled>
            </div>            
        </div>

		<h2 class="chuc-mung">Wait</h2>
        <div>	
            <h2 class="text-tuyen-hua">wait...</h2>
			<h1 class="date-tuyen-hua">wait...</h1>			
        </div>

        <div class="biography">
            <h2>Hình Ành Sa Mạc horeb 101:</h2>
			<iframe src="../loadImg.html" width="100%" height="500px" frameborder="0"></iframe>
        </div>
    </div>

    <script>
		document.addEventListener("DOMContentLoaded", function () {
            // Nhúng giá trị từ server vào JavaScript
            const ketquasamac = `Đạt`; // Render từ EJS

            if (ketquasamac === "Đạt") {
                // Thay đổi nội dung của các class
                document.querySelector('.chuc-mung').textContent = "Xin Chúc Mừng Tân Huynh Trưởng Cấp 1";
                document.querySelector('.text-tuyen-hua').textContent = "Hẹn Gặp lại nhau ngày tuyên hứa bạn nhé!";
                document.querySelector('.date-tuyen-hua').textContent = "15-12-2024";
				document.querySelector('.chuc-mung').classList.add("blinking");
				document.querySelector('.text-tuyen-hua').classList.add("blinking");
				document.querySelector('.date-tuyen-hua').classList.add("blinking");
            }else{
				document.querySelector('.chuc-mung').textContent = "Rất tiếc, bạn chưa đạt";
				document.querySelector('.text-tuyen-hua').textContent = "Hãy cố gắng hơn trong lần sau!";
				document.querySelector('.date-tuyen-hua').textContent = "";
				
				// Loại bỏ hiệu ứng nhấp nháy
				document.querySelector('.chuc-mung').classList.remove("blinking");
				document.querySelector('.text-tuyen-hua').classList.remove("blinking");
				document.querySelector('.date-tuyen-hua').classList.remove("blinking");
			}
        });
	</script>
</body>

</html>
